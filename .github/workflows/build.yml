# Builds WildGuns for Windows, Linux and Android on every push to main and
# publishes (or updates) the release v<VERSION>. The packages hold the program,
# SDL2 and the snes9x libretro core: no game. Each player uses their own ROM.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SDL: 2.30.9
  SNES9X: fae2fea08f74180759ef540ee94259213f503480

jobs:
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 zip
      - name: SDL2 for MinGW
        run: curl -sSfL --retry 5 https://github.com/libsdl-org/SDL/releases/download/release-$SDL/SDL2-devel-$SDL-mingw.tar.gz | tar xz
      - name: snes9x core
        run: |
          git clone -q https://github.com/libretro/snes9x.git && git -C snes9x checkout -q $SNES9X
          make -C snes9x/libretro -j4 platform=win CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++
      - name: Build
        run: |
          S=SDL2-$SDL/x86_64-w64-mingw32
          x86_64-w64-mingw32-gcc -O2 -Isrc -I$S/include/SDL2 -I$S/include src/wildguns.c -o WildGuns.exe \
            -L$S/lib -lmingw32 -lSDL2main -lSDL2 -lcomdlg32 -luser32 -lshell32 -lm -mwindows -static-libgcc
      - name: Package
        run: |
          out=WildGuns-Windows
          mkdir -p $out/licenses
          cp WildGuns.exe SDL2-$SDL/x86_64-w64-mingw32/bin/SDL2.dll snes9x/libretro/snes9x_libretro.dll $out/
          cp LEEME.txt README.md $out/
          cp SDL2-$SDL/LICENSE.txt $out/licenses/SDL2-LICENSE.txt 2>/dev/null || true
          cp snes9x/LICENSE $out/licenses/snes9x-LICENSE.txt
          zip -qr9 WildGuns-Windows.zip $out
      - uses: actions/upload-artifact@v4
        with: { name: WildGuns-Windows, path: WildGuns-Windows.zip }

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev patchelf
      - name: snes9x core
        run: |
          git clone -q https://github.com/libretro/snes9x.git && git -C snes9x checkout -q $SNES9X
          make -C snes9x/libretro -j4
      - name: Build
        run: |
          make
          patchelf --set-rpath '$ORIGIN/lib' wildguns
      - name: Package
        run: |
          out=WildGuns-Linux
          mkdir -p $out/lib $out/licenses
          cp wildguns snes9x/libretro/snes9x_libretro.so $out/
          cp -L $(ldconfig -p | awk '/libSDL2-2.0.so.0 /{print $NF; exit}') $out/lib/
          cp LEEME.txt README.md $out/
          cp snes9x/LICENSE $out/licenses/snes9x-LICENSE.txt
          tar -czf WildGuns-Linux.tar.gz $out
      - uses: actions/upload-artifact@v4
        with: { name: WildGuns-Linux, path: WildGuns-Linux.tar.gz }

  android:
    runs-on: ubuntu-24.04
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: SDL2 sources
        run: curl -sSfL --retry 5 https://github.com/libsdl-org/SDL/releases/download/release-$SDL/SDL2-$SDL.tar.gz | tar xz
      - name: snes9x core for the phone
        run: |
          git clone -q https://github.com/libretro/snes9x.git && git -C snes9x checkout -q $SNES9X
          cd snes9x/libretro/jni && $ANDROID_NDK_HOME/ndk-build -j4 APP_ABI="arm64-v8a armeabi-v7a x86_64"
      - name: Prepare
        run: |
          sh tools/android-prepare.sh SDL2-$SDL snes9x/libretro/libs
          mkdir -p android/app/src/main/assets/licenses
          cp snes9x/LICENSE android/app/src/main/assets/licenses/snes9x-LICENSE.txt
          cp SDL2-$SDL/LICENSE.txt android/app/src/main/assets/licenses/SDL2-LICENSE.txt
      - name: Signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 || secrets.MANSION_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/release.keystore
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
            echo "signed=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret: the APK is signed with a throwaway debug key and is not published"
          fi
      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.MANSION_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.MANSION_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.MANSION_KEY_PASSWORD }}
        run: |
          ndk=$(sed -n 's/^Pkg.Revision *= *//p' $ANDROID_NDK_HOME/source.properties)
          v=$(cat VERSION)
          cd android
          gradle --no-daemon assembleRelease -PndkVersion=$ndk -PversionCode=${{ github.run_number }} -PversionName=$v
          cp app/build/outputs/apk/release/app-release.apk ../WildGuns-Android.apk
          cd ..
          for c in 'Lcom/vito2492/wildguns/WildGunsActivity;' 'Lorg/libsdl/app/SDLActivity;'; do
            unzip -p WildGuns-Android.apk 'classes*.dex' | grep -aqF "$c" || { echo "::error::$c is missing from the APK"; exit 1; }
          done
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for so in libmain.so libSDL2.so libsnes9x_libretro.so; do
              unzip -l WildGuns-Android.apk | grep -q "lib/$abi/$so" || { echo "::error::lib/$abi/$so is missing from the APK"; exit 1; }
            done
          done
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs WildGuns-Android.apk | grep -i "SHA-256"
      - uses: actions/upload-artifact@v4
        with: { name: WildGuns-Android, path: WildGuns-Android.apk }

  release:
    # The APK is published only when signed with the fixed key, so every
    # version installs over the previous one and keeps the saves.
    if: github.ref == 'refs/heads/main'
    needs: [windows, linux, android]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "tag=v$(cat VERSION)" >> $GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - name: Keep the APK only if signed
        if: needs.android.outputs.signed != 'true'
        run: rm -f WildGuns-Android.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Wild Guns: Frontier Edition ${{ steps.v.outputs.tag }}"
          body: |
            Windows: descomprimí WildGuns-Windows.zip, poné tu ROM "Wild Guns (USA).sfc" al lado de WildGuns.exe y abrilo (o elegila cuando la pida).
            Linux: descomprimí WildGuns-Linux.tar.gz, poné la ROM al lado y corré ./wildguns
            Android: instalá WildGuns-Android.apk (hay que permitir apps de origen desconocido). La primera vez te pide elegir tu ROM (.sfc, .smc o .zip). Las versiones nuevas se instalan encima y conservan las partidas.
            No incluye el juego: usá tu propia copia (versión USA).
          files: |
            WildGuns-Windows.zip
            WildGuns-Linux.tar.gz
            WildGuns-Android.apk
