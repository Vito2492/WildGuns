name: Build Windows, Linux AppImage & Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download SDL2 & snes9x_libretro (x64)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL/releases/download/release-2.30.10/SDL2-devel-2.30.10-VC.zip" -OutFile sdl2.zip
          Expand-Archive sdl2.zip -DestinationPath vendor -Force
          Copy-Item "vendor\SDL2-2.30.10\lib\x64\SDL2.dll" -Destination "." -Force
          Invoke-WebRequest -Uri "https://buildbot.libretro.com/nightly/windows/x86_64/latest/snes9x_libretro.dll.zip" -OutFile core.zip
          Expand-Archive core.zip -DestinationPath "." -Force

      - name: Compile WildGuns.exe (MSVC x64)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /O2 /W3 /D_CRT_SECURE_NO_WARNINGS /Isrc /Ivendor\SDL2-2.30.10\include src\wildguns.c /Fe:WildGuns.exe /link /SUBSYSTEM:WINDOWS /ENTRY:mainCRTStartup vendor\SDL2-2.30.10\lib\x64\SDL2.lib comdlg32.lib user32.lib

      - name: Package Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\win | Out-Null
          Copy-Item WildGuns.exe, SDL2.dll, snes9x_libretro.dll, LEEME.txt -Destination dist\win
          Compress-Archive -Path dist\win\* -DestinationPath WildGuns-Windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: WildGuns-Windows-x64
          path: WildGuns-Windows-x64.zip

  linux-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 & tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev unzip wget file

      - name: Fetch snes9x_libretro.so & appimagetool
        run: |
          wget -q https://buildbot.libretro.com/nightly/linux/x86_64/latest/snes9x_libretro.so.zip
          unzip -o snes9x_libretro.so.zip
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool

      - name: Build WildGuns-x86_64.AppImage
        run: |
          make
          APPIMAGE_EXTRACT_AND_RUN=1 bash packaging/linux/build_appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: WildGuns-Linux-AppImage
          path: WildGuns-x86_64.AppImage

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Fetch SDL2 source & Android snes9x cores
        run: |
          mkdir -p vendor android/app/src/main/jniLibs/arm64-v8a android/app/src/main/jniLibs/armeabi-v7a
          git clone --depth 1 --branch release-2.30.10 https://github.com/libsdl-org/SDL.git vendor/SDL2
          cp -r vendor/SDL2/android-project/app/src/main/java/org android/app/src/main/java/
          wget -q https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/snes9x_libretro_android.so.zip -O core64.zip
          unzip -o core64.zip -d /tmp/c64
          cp /tmp/c64/snes9x_libretro_android.so android/app/src/main/jniLibs/arm64-v8a/libsnes9x_libretro.so
          wget -q https://buildbot.libretro.com/nightly/android/latest/armeabi-v7a/snes9x_libretro_android.so.zip -O core32.zip
          unzip -o core32.zip -d /tmp/c32
          cp /tmp/c32/snes9x_libretro_android.so android/app/src/main/jniLibs/armeabi-v7a/libsnes9x_libretro.so

      - name: Decode signing keystore (if configured)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build Android APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_FILE:-}" ]; then
            gradle assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../WildGuns-Android.apk
          else
            gradle assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../WildGuns-Android.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: WildGuns-Android-APK
          path: WildGuns-Android.apk

  release:
    needs: [ windows, linux-appimage, android-apk ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/WildGuns-Windows-x64/WildGuns-Windows-x64.zip
            artifacts/WildGuns-Linux-AppImage/WildGuns-x86_64.AppImage
            artifacts/WildGuns-Android-APK/WildGuns-Android.apk
